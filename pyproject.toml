[project]
name = "agentic-rl-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.28.0",
    "requests>=2.32",
    "tokenizers>=0.23.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
